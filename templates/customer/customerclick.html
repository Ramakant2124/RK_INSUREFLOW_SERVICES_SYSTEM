<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

  <style media="screen">
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
     background: linear-gradient(135deg, #00b3ffff, #feffffff, #00b3ffff);

      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
    }

    .jumbotron {
      margin: 0 auto;
      margin-top: 40px;
      max-width: 700px;
      background: rgba(255, 255, 255, 0); /* transparent white */
      border-radius: 15px;
      padding: 2rem;
      backdrop-filter: blur(10px); /* Glass effect */
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      color: #000000ff;
      text-align: center;
    }

    .jumbotron h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .jumbotron p {
      font-size: 1.2rem;
    }

    .btn {
      margin: 0.5rem;

    }

</head>
